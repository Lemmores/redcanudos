<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Classificação · RED CANUDOS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tabla-classificacao {
            width: 100%;
            border-collapse: collapse;
        }
        .tabla-classificacao th, 
        .tabla-classificacao td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .tabla-classificacao th.col-center, 
        .tabla-classificacao td.col-center {
            text-align: center !important;
        }
        .tabla-classificacao th.col-left, 
        .tabla-classificacao td.col-left {
            text-align: left !important;
        }
    </style>
</head>
<body>

    <!-- NAVBAR PADRONIZADA -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo-brand">
                <img src="Logo Canudos.png" alt="RED Canudos Logo" class="nav-logo">
                <span class="brand-name"><span class="red-text">RED</span> CANUDOS</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="index.html#times">Times</a>
                <a href="index.html#jogadores">Jogadores</a>
                <a href="partidas.html">Partidas</a>
                <a href="tabela.html" class="active">Tabela</a>
                <a href="estatisticas.html">Estatísticas</a>
                <a href="regras.html">Regras</a>
            </nav>
            <div class="menu-toggle" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </header>

    <main class="main-container">
        
        <div class="banner-hero">
            <div class="banner-content">
                <h1>TABELA DE CLASSIFICAÇÃO</h1>
                <p class="banner-subtitle">RED CANUDOS · TEMPORADA REGULAR 2026</p>
            </div>
        </div>

        <section class="sidebar-card" style="margin-bottom: 2rem;">
            <div class="section-title-bar">
                <h2><i class="fa-solid fa-list-ol"></i> CLASSIFICAÇÃO DOS TIMES</h2>
            </div>

            <div style="overflow-x: auto;">
                <table class="mini-table tabla-classificacao">
                    <thead>
                        <tr>
                            <th class="col-center" style="width: 50px;">#</th>
                            <th class="col-left">Equipe</th>
                            <th class="col-center">Vitórias (V)</th>
                            <th class="col-center">Derrotas (D)</th>
                            <th class="col-center">Aproveitamento</th>
                            <th class="col-center">Pontos (PTS)</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaClassificacaoBody">
                        <tr><td colspan="6" class="loading-text">Carregando classificação...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>RED CANUDOS © 2026 · O TORNEIO DA MATILHA</p>
    </footer>

    <script src="script.js"></script>

    <!-- INTEGRAÇÃO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3g6QE7YBg0vEAYoCoZa4lI3hc2_C-J4Y",
            authDomain: "canudos-200c7.firebaseapp.com",
            projectId: "canudos-200c7",
            storageBucket: "canudos-200c7.firebasestorage.app",
            messagingSenderId: "1055281066343",
            appId: "1:1055281066343:web:80afb45157dacbe503bfc2",
            measurementId: "G-JEP4G8QFHE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function carregarTabelaOficial() {
            const body = document.getElementById('tabelaClassificacaoBody');
            try {
                const snap = await getDocs(collection(db, "tabela"));
                if (snap.empty) {
                    body.innerHTML = '<tr><td colspan="6" class="empty-text">Nenhum time registrado na tabela ainda.</td></tr>';
                    return;
                }

                let times = [];
                snap.forEach(docSnap => times.push(docSnap.data()));

                // Ordenação: Pontos > Vitórias
                times.sort((a, b) => (b.pontos || 0) - (a.pontos || 0) || (b.vitorias || 0) - (a.vitorias || 0));

                body.innerHTML = '';
                let pos = 1;

                times.forEach(t => {
                    const v = t.vitorias || 0;
                    const d = t.derrotas || 0;
                    const totalJogos = v + d;
                    const winrate = totalJogos > 0 ? ((v / totalJogos) * 100).toFixed(0) + '%' : '0%';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="col-center pos">${pos}</td>
                        <td class="col-left">
                            <div class="mini-team" style="display:flex; align-items:center; gap:0.6rem;">
                                <div class="team-icon-sm" style="width:28px; height:28px; background:var(--bg-main); border:1px solid var(--border-color); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--red-primary); font-size:0.8rem;">${t.nome ? t.nome.charAt(0) : 'T'}</div>
                                <strong style="color:#fff; font-size:0.95rem;">${t.nome}</strong>
                            </div>
                        </td>
                        <td class="col-center" style="font-weight:700; color:#00e676;">${v}</td>
                        <td class="col-center" style="font-weight:700; color:#ff5252;">${d}</td>
                        <td class="col-center" style="color:var(--text-muted); font-weight:700;">${winrate}</td>
                        <td class="col-center bold" style="color:var(--red-primary); font-size:1.1rem; font-weight:900;">${t.pontos || (v * 3)}</td>
                    `;
                    body.appendChild(tr);
                    pos++;
                });

            } catch (err) {
                console.error("Erro ao carregar tabela:", err);
                body.innerHTML = '<tr><td colspan="6" class="empty-text">Erro ao carregar tabela de classificação.</td></tr>';
            }
        }

        window.addEventListener('DOMContentLoaded', carregarTabelaOficial);
    </script>
</body>
</html>
